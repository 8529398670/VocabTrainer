<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title data-i18n="app.title">&nbsp;</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<!--
  screen-train, not just app: the training screen is sized to exactly one
  viewport and given nothing to scroll, so that a swipe on a card can never be
  mistaken for a drag on the page underneath it. Every other screen is a
  normal scrolling document and carries "app" alone.
-->
<body class="app screen-train">
  <!--
    No text is hardcoded here. Every visible string carries a data-i18n key
    that server/language resolves from language.yaml at runtime, so the copy
    can change (or be removed entirely) without editing this file.
  -->
  <header class="app-header">
    <div>
      <h1 data-i18n="train.heading"></h1>
    </div>
    <div id="who-am-i" class="who"></div>
  </header>

  <main hidden id="main">
    <section id="signed-out" class="card" hidden>
      <h2 data-i18n="signed_out.heading"></h2>
      <p data-i18n="signed_out.body"></p>
      <p id="invalid-link" class="notice notice-warn" data-i18n="signed_out.invalid_link" hidden></p>
    </section>

    <section id="signed-in" hidden>
      <div class="trainer">
        <div class="deck-meta" id="deck-meta">
          <span id="deck-remaining"></span>
          <!-- Only shown while the deck is filtered to the not-known list, so
               a short run is never mistaken for having run out of words. -->
          <span id="deck-practice" class="badge badge-practice" hidden></span>
          <div class="deck-progress" id="deck-progress"><span id="deck-progress-fill"></span></div>
          <span id="deck-counts"></span>
        </div>

        <!-- Cards are built by train.js; this is only the stage they sit on. -->
        <div class="card-stack" id="card-stack"></div>

        <div id="deck-controls">
          <!-- train.js reorders these to match the chosen swipe directions. -->
          <div class="deck-actions" id="deck-actions">
            <button type="button" id="action-unknown" class="action-unknown">
              <span class="action-icon" aria-hidden="true">←</span>
              <span data-i18n="train.unknown_button"></span>
            </button>
            <button type="button" id="action-skip" class="action-skip">
              <span class="action-icon" aria-hidden="true">↑</span>
              <span data-i18n="train.skip_button"></span>
            </button>
            <button type="button" id="action-known" class="action-known">
              <span class="action-icon" aria-hidden="true">→</span>
              <span data-i18n="train.known_button"></span>
            </button>
          </div>

          <!-- The four-grade row, for the Anki-style scoring mode. Hidden
               until train.js says otherwise, and the three-answer row above
               is hidden in its place -- the two are never both on screen.

               The grades stay in this order however the swipes are arranged,
               unlike the row above: what a grade means is where it sits in
               the sequence, so a row out of order is a row you have to read
               rather than glance at. Only the two ends carry an arrow,
               because only those two are on a swipe; the empty spans are
               filled in (or left empty) by renderGradeControls. -->
          <div class="deck-grades" id="deck-grades" hidden>
            <button type="button" id="grade-again" class="grade-again">
              <span class="action-icon" aria-hidden="true"></span>
              <span data-i18n="train.grade_again"></span>
              <span class="grade-interval" aria-hidden="true"></span>
            </button>
            <button type="button" id="grade-hard" class="grade-hard">
              <span class="action-icon" aria-hidden="true"></span>
              <span data-i18n="train.grade_hard"></span>
              <span class="grade-interval" aria-hidden="true"></span>
            </button>
            <button type="button" id="grade-good" class="grade-good">
              <span class="action-icon" aria-hidden="true"></span>
              <span data-i18n="train.grade_good"></span>
              <span class="grade-interval" aria-hidden="true"></span>
            </button>
            <button type="button" id="grade-easy" class="grade-easy">
              <span class="action-icon" aria-hidden="true"></span>
              <span data-i18n="train.grade_easy"></span>
              <span class="grade-interval" aria-hidden="true"></span>
            </button>
          </div>

          <!-- Skip has no place in a row of grades -- it is not one, and a
               fifth button would take a fifth of a phone's width from four
               that need it. It gets its own line instead. -->
          <div class="deck-aside" id="deck-aside" hidden>
            <button type="button" id="grade-skip" class="action-skip">
              <span class="action-icon" aria-hidden="true"></span>
              <span data-i18n="train.skip_button"></span>
            </button>
          </div>

          <p class="deck-help" id="gesture-help"></p>
          <!-- Hidden on a touch device by the stylesheet: two lines about the
               arrow keys is a poor trade for two lines of a phone screen. -->
          <p class="deck-help deck-help-keyboard" data-i18n="train.keyboard_help"></p>
        </div>

        <!-- Both ways on from an empty deck: keep going here, or go and
             change what a run is made of. train.js hides the button when
             there is nothing new left to offer. -->
        <div id="deck-empty" class="empty-state" hidden>
          <h2 id="deck-empty-heading"></h2>
          <p id="deck-empty-body"></p>
          <div class="empty-actions">
            <button type="button" id="deck-more" hidden></button>
            <a href="/settings.html" data-i18n="train.empty_action"></a>
          </div>
        </div>
      </div>
    </section>

    <p id="error-banner" class="notice notice-error" hidden></p>
  </main>

  <nav class="tabbar" id="tabbar" hidden></nav>

  <!--
    Plain scripts in dependency order. No bundler, no modules that need a
    build step: each file adds one global and the browser runs them as-is.
  -->
  <script src="/js/dom.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/speech.js"></script>
  <script src="/js/fit.js"></script>
  <script src="/js/swipe.js"></script>
  <script src="/js/train.js"></script>
</body>
</html>
