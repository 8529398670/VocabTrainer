  tap_to_continue: "Tap to continue"
  known_button: "I know it"
  unknown_button: "Don't know"
  skip_button: "Skip"
  # The label on the button that reads a word aloud, used as its accessible
  # name and its tooltip -- the button itself is a drawn speaker, not text.
  # Empty removes the button, as everywhere else. It never appears on a device
  # with no speech engine, whatever this says.
  speak_label: "Pronounce"
  hint_known: "Known"
  hint_unknown: "Not known"
  hint_skip: "Skipped"
  # The four-grade scoring mode -- see settings.scoring_heading. Only Again
  # and Easy can be reached by swiping, so only those two have a card hint;
