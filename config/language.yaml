  speech_heading: "Pronunciation"
  speech_help: "The speaker on each card reads the word aloud using a voice already on this device. Which voices are on offer is up to the device, so a voice chosen here may not exist on another one -- that one falls back to its own default."
  speech_voice_label: "Voice"
  speech_voice_auto: "Whatever this device uses"
  speech_preview: "Hear it"
  # The word the preview button says. Any word will do; a long one shows more
