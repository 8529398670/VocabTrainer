  practice_new_note: "No reviews, no daily limit and no end: a run is followed straight away by the next one. Words you answer still go into your lists -- they just never come back."
  pace_heading: "Pacing"
  reveal_hold_heading: "Answering without revealing"
  reveal_hold_help: "Swipe (or press a button) without turning the card over and the answer is shown anyway, so a wrong guess is corrected on the spot. This is how long it stays up."
  reveal_hold_label: "Show the answer for"
  reveal_hold_none: "Don't show it at all"
  reveal_hold_500: "0.5 seconds"
  reveal_hold_1000: "1 second"
  reveal_hold_1500: "1.5 seconds"
  reveal_hold_2000: "2 seconds"
  reveal_hold_3000: "3 seconds"
  reveal_hold_5000: "5 seconds"
  reveal_hold_8000: "8 seconds"
  reveal_hold_15000: "15 seconds"
  reveal_hold_until: "Until I answer again"
