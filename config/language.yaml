  tier_1: "Grade 1"
  tier_2: "Grade 2"
  tier_3: "Grade 3"
  tier_4: "Grade 4"
  tier_5: "Grade 5"
  tier_6: "Grade 6"
  tier_7: "Grade 7"
  tier_8: "Grade 8"
  tier_9: "Grade 9"
  tier_10: "Grade 10"
  tier_11: "Grade 11"
  tier_12: "Grade 12"
  tier_13: "Undergraduate"
  tier_14: "Graduate"
  tier_15: "Doctoral"
  word_count: "words at this level"

train:
