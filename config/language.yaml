  gesture_help: "Swipe {known} if you know it, {unknown} if you don't, {skip} to skip. Or use the buttons."
  keyboard_help: "Keyboard: the arrow keys match the swipes · space reveals."
  # The same line for the four-grade mode, where the number keys reach the two
  # grades no swipe can.
  keyboard_help_graded: "Keyboard: 1 to 4 across the grades · left and right match them · up skips · space reveals."
  practice_badge: "Not known only"
  empty_practice_heading: "Nothing left to practise"
  empty_practice_body: "Your not-known list is empty. Switch back to the normal deck in Settings to meet new words."
  # Shown while the deck is nothing but words never seen before. That deck
