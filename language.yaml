  uses_label: "How many people can use it"
  role_label: "Role"
  create_button: "Create invite link"
  # {uses} is the number of people it admits, {days} how long it lasts.
  link_notice: "Share this link. The first {uses} people to open it can join, and it stops working after {days} days. It is shown once and cannot be recovered."
