# Downloading your words as a spreadsheet. Three sheets, one per list.
#
# The empty-key rule reaches further here than anywhere else in this file. An
# empty column heading leaves that column out of the file, and an empty sheet
# name leaves that sheet out -- so cutting the export down to a plain word
# list, or to one list rather than three, is an edit here and nothing else.
# Empty the heading and the whole feature disappears from Settings.
export:
  heading: "Export"
  body: "Your three lists as a spreadsheet, one sheet each. Opens in Excel, Numbers, LibreOffice and Google Sheets."
  button: "Download .xlsx"
  # The start of the saved filename; the date is added to it. Anything that is
  # not a letter, a digit, a dash, a dot or an underscore becomes a dash.
  filename: "vocab-trainer-words"
  sheet_unknown: "Not known"
  sheet_known: "Known"
  sheet_skipped: "Skipped"
  column_word: "Word"
  # The number sorts, the name reads. Delete whichever you do not want.
  column_level: "Level"
  column_level_name: "Level name"
  column_pos: "Part of speech"
  column_definition: "Definition"
  column_example: "Example"
  column_lapses: "Times missed"
  column_reviews: "Reviews"
  column_first_seen: "First seen"
  column_last_seen: "Last seen"
  column_due: "Due"

sources:
  heading: "Where the words come from"
  body: >-
    Definitions come from Princeton WordNet. Reading levels are estimated from
    age-of-acquisition ratings (Kuperman, Stadthagen-González & Brysbaert
    2012) combined with word frequencies from OpenSubtitles and the Google Web
    corpus. See ATTRIBUTION.md in the source for full citations and licences.

errors:
