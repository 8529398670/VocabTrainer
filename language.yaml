  # {seats} places remain of {total}.
  seats_left: "{seats} of {total} places left on this link."
  name_label: "Your name"
  name_placeholder: "What should we call you?"
  submit_button: "Join"
  refused_heading: "This link will not work"
  refused_invalid: "This invite link is not valid. Check you copied the whole thing, or ask whoever shared it for a new one."
  refused_full: "This invite has already been used by as many people as it allows. Ask for a new link."
  refused_expired: "This invite has expired. Ask for a new link."
  refused_revoked: "This invite was withdrawn. Ask for a new link."
  already_heading: "You are already signed in"
  # {name} is the display name of the account already signed in here.
  already_body: "You are signed in as {name}, so there is no need to use this invite -- it would make you a second, empty account."
  already_action: "Go to the app"
  done_heading: "Welcome"
  done_body: "Setting up your account…"

